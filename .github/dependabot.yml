# Weekly pull requests for newer libraries and GitHub Actions. Minor and patch updates are grouped
# into one pull request per ecosystem so they are easy to review; CI must pass before merging.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # Media3 1.11 shifts RTSP lip-sync by about 70 ms; update it by hand after re-measuring.
      - dependency-name: "androidx.media3:*"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
